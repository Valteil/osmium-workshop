<script>
(function(){
  fetch('content/README.md')
    .then(function(r){ return r.text(); })
    .then(function(md){
      document.getElementById('doc-content').innerHTML = window.renderMarkdown(md);
    })
    .catch(function(){
      document.getElementById('doc-content').innerHTML =
        '<p>Couldn\'t load the readme content. <a href="https://github.com/Valteil/osmium-workshop#readme" target="_blank" rel="noopener">Read it on GitHub instead</a>.</p>';
    });
  // Keeps the Download button's version in sync with the latest release,
  // same fetch index.html uses, so this page never goes stale again.
  fetch('https://api.github.com/repos/Valteil/osmium-workshop/releases/latest')
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(rel){
      if (rel && rel.tag_name){
        document.querySelectorAll('[data-latest-ver]').forEach(function(el){ el.textContent = rel.tag_name; });
      }
    })
    .catch(function(){ /* leave the static "v1.6.0" text in place */ });
})();
